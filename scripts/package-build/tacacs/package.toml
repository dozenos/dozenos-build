[[packages]]
name = "libtacplus-map"
commit_id = "rolling"
scm_url = "https://github.com/dozenos/libtacplus-map.git"
pre_build_hook = "/dozenos-rebrand/rename-transform.sh ."
build_cmd = "dpkg-buildpackage -us -uc -tc -b"

[[packages]]
name = "libpam-tacplus"
commit_id = "rolling"
scm_url = "https://github.com/dozenos/libpam-tacplus.git"
pre_build_hook = "/dozenos-rebrand/rename-transform.sh ."
build_cmd = "sudo dpkg -i ../libtacplus-map*.deb; dpkg-buildpackage -us -uc -tc -b"

[[packages]]
name = "libnss-tacplus"
commit_id = "rolling"
scm_url = "https://github.com/dozenos/libnss-tacplus.git"
pre_build_hook = "/dozenos-rebrand/rename-transform.sh ."
build_cmd = "sudo dpkg -i ../libtac*.deb ../libpam-tacplus*.deb; dpkg-buildpackage -us -uc -tc -b"

[dependencies]
packages = [
    "libpam-dev",
    "libssl-dev",
    "autoconf-archive",
    "libaudit-dev"
]
