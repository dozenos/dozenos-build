[[packages]]
name = "dozenos-vpp-patches"
commit_id = "rolling"
scm_url = "https://github.com/dozenos/dozenos-vpp-patches"
build_cmd = "/bin/true"
apply_patches = false

[[packages]]
name = "vpp"
commit_id = "stable/2510"
scm_url = "https://github.com/FDio/vpp"
# Skip apply patches by build.py as we use them in build_cmd
apply_patches = false

pre_build_hook = """
mkdir -p ../patches/vpp/
rsync -av ../dozenos-vpp-patches/patches/vpp/ ../patches/vpp/
"""

build_cmd = """
# Patches for vpp should applied here
for patch in ../patches/vpp/*.patch; do
    echo "I: build_cmd applying patch $patch..."
    git -c user.email=maintainers@dozenos.local -c user.name=dozenos am "$patch" || { echo "Failed to apply patch $patch"; exit 1; }
done

make UNATTENDED=yes VPP_ENABLE_SYSTEMD_NOTIFY=ON install-dep
make VPP_EXTRA_CMAKE_ARGS="-DVPP_ENABLE_SYSTEMD_NOTIFY=ON" pkg-deb
cp build-root/*.deb ../
"""

[dependencies]
packages = [
    "llvm"
]
