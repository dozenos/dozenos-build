[[packages]]
name = "pdns-recursor"
commit_id = "c24eb42e31172dc71b36e822915e802f489fe9ee" # debian/bookworm, 4.8.8-1+deb12u1
scm_url = "https://salsa.debian.org/debian/pdns-recursor.git"

# Our rebuild must not share its version with the Debian package, otherwise APT
# cannot tell the installed build apart and reports a downgrade on dist-upgrade
pre_build_hook = """
export DEBEMAIL="maintainers@dozenos.local"
export DEBFULLNAME="DozenOS Package Maintainers"
dch -v "4.8.8-1+deb12u1+dozenos0" "Rebuild with DozenOS patches"
"""
